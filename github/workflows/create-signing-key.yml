name: Create signing key (run once)

on: workflow_dispatch

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_PASSWORD secret first"
            exit 1
          fi
          keytool -genkeypair -alias daybook -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype PKCS12 -keystore daybook.jks \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Daybook, O=Daybook, C=US"
          base64 -w0 daybook.jks > keystore.b64

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: keystore.b64
          retention-days: 1
